<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <title>%APP_NAME%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%APP_NAME%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%OG_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_NAME%" />
    <meta name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      /* Shown before any script or font arrives (SHELL-10). */
      html,
      body {
        margin: 0;
        height: 100%;
        background: %BACKGROUND_COLOR%;
        color: #13231d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font:
          600 16px system-ui,
          -apple-system,
          sans-serif;
      }
      #boot i {
        display: block;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid #cdd8c6;
        border-top-color: %THEME_COLOR%;
        animation: s 0.9s linear infinite;
      }
      @keyframes s {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status"><i aria-hidden="true"></i><span>Opening the field guide…</span></div>
    </div>
    <noscript>This game needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
